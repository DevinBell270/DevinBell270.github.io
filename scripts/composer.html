<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New status</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f8f8;
      --text: #111;
      --muted: #555;
      --line: #000;
      --focus: #2b8a3e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 2rem auto;
      max-width: 36rem;
      padding: 0 1rem 3rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier Prime", Courier, monospace;
      font-size: 1rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
      margin: 0 0 0.5rem;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 1rem 0 0.35rem;
    }

    textarea,
    button,
    .drop {
      font: inherit;
      color: inherit;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 7rem;
      padding: 0.5rem;
      border: 1px solid var(--line);
      background: transparent;
      resize: vertical;
    }

    .drop {
      margin-top: 0.75rem;
      padding: 1.25rem 0.75rem;
      border: 1px dashed var(--line);
      text-align: center;
      cursor: pointer;
    }

    .drop.over { background: rgba(0, 0, 0, 0.06); }

    .previews {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    figure { margin: 0; }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid var(--line);
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    figure button {
      background: transparent;
      color: inherit;
    }

    .note {
      color: var(--muted);
      margin: 0.75rem 0 0;
    }

    .error { color: #8a1f11; }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <h1>New status</h1>
  <p class="note">Photos are converted to black-and-white halftone. Commit and push to publish.</p>
  <form id="form">
    <label for="message">Status</label>
    <textarea id="message" placeholder="What's going on?"></textarea>
    <div id="drop" class="drop" role="button" tabindex="0">Drop up to 6 photos here, or choose files</div>
    <input id="files" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp,.gif,.tif,.tiff" multiple hidden>
    <div id="previews" class="previews"></div>
    <button id="send" type="submit">Post status</button>
  </form>
  <p id="note" class="note" aria-live="polite"></p>
  <script>
    const MAX_PHOTOS = 6;
    const messageBox = document.getElementById("message");
    const drop = document.getElementById("drop");
    const files = document.getElementById("files");
    const previews = document.getElementById("previews");
    const send = document.getElementById("send");
    const note = document.getElementById("note");
    const form = document.getElementById("form");
    const photos = [];
    let nextId = 0;
    let pending = 0;
    let saving = false;

    function setNote(text, isError) {
      note.textContent = text;
      note.className = isError ? "note error" : "note";
    }

    function syncSend() {
      send.disabled = saving || pending > 0;
    }

    function isImage(file) {
      return file.type.startsWith("image/") || /\.(heic|heif|jpe?g|png|webp|gif|tiff?)$/i.test(file.name || "");
    }

    function renderPreview(item) {
      const figure = document.createElement("figure");
      figure.dataset.id = String(item.id);
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = "Halftone preview";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => removePhoto(item.id));
      figure.append(img, remove);
      return figure;
    }

    function removePhoto(id) {
      const index = photos.findIndex((photo) => photo.id === id);
      if (index === -1) return;
      URL.revokeObjectURL(photos[index].url);
      photos.splice(index, 1);
      const figure = previews.querySelector(`[data-id="${id}"]`);
      if (figure) figure.remove();
    }

    async function halftoneFile(file) {
      const response = await fetch("/api/halftone", {
        method: "POST",
        headers: {
          "Content-Type": file.type || "application/octet-stream",
          "X-Filename": encodeURIComponent(file.name || "photo"),
        },
        body: file,
      });
      if (!response.ok) {
        let message = "Could not convert that photo.";
        try {
          const data = await response.json();
          if (data.error) message = data.error;
        } catch (error) {
          /* The error body was not JSON. */
        }
        throw new Error(message);
      }
      return response.blob();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function addFiles(fileList) {
      const incoming = [...fileList].filter(isImage);
      if (!incoming.length) {
        setNote("Use a JPEG, PNG, WebP, GIF, or HEIC photo.", true);
        return;
      }
      for (const file of incoming) {
        if (photos.length + pending >= MAX_PHOTOS) {
          setNote("You can attach up to 6 photos.", true);
          break;
        }
        pending += 1;
        syncSend();
        const placeholder = document.createElement("p");
        placeholder.textContent = `Converting ${file.name || "photo"}...`;
        previews.append(placeholder);
        try {
          const blob = await halftoneFile(file);
          const item = { id: ++nextId, url: URL.createObjectURL(blob), file };
          photos.push(item);
          placeholder.replaceWith(renderPreview(item));
        } catch (error) {
          placeholder.remove();
          setNote(error.message, true);
        } finally {
          pending -= 1;
          syncSend();
        }
      }
    }

    drop.addEventListener("click", () => files.click());
    drop.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        files.click();
      }
    });
    files.addEventListener("change", () => {
      addFiles(files.files);
      files.value = "";
    });

    window.addEventListener("dragover", (event) => event.preventDefault());
    window.addEventListener("drop", (event) => {
      event.preventDefault();
      if (!drop.contains(event.target)) addFiles(event.dataTransfer.files);
    });
    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.stopPropagation();
      drop.classList.add("over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      event.stopPropagation();
      drop.classList.remove("over");
      addFiles(event.dataTransfer.files);
    });
    window.addEventListener("paste", (event) => {
      const pasted = [...(event.clipboardData?.files || [])].filter(isImage);
      if (!pasted.length) return;
      event.preventDefault();
      addFiles(pasted);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageBox.value;
      if (!message.trim() && photos.length === 0) {
        setNote("Write a status or add a photo.", true);
        messageBox.focus();
        return;
      }
      saving = true;
      syncSend();
      setNote("Saving...");
      try {
        const encoded = [];
        for (const photo of photos) {
          encoded.push({
            name: photo.file.name || "photo",
            data: await fileToBase64(photo.file),
          });
        }
        const response = await fetch("/api/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, photos: encoded }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not save the status.");
        photos.splice(0).forEach((photo) => URL.revokeObjectURL(photo.url));
        previews.replaceChildren();
        messageBox.value = "";
        setNote(`Saved ${data.files.join(", ")}. Commit and push when you want it on the site.`);
        messageBox.focus();
      } catch (error) {
        setNote(error.message || "Could not save the status.", true);
      } finally {
        saving = false;
        syncSend();
      }
    });
  </script>
</body>
</html>
